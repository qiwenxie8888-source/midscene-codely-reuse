<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>用例管理 · game-smoke</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .suite-block { background: #fff; border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
      .suite-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #eef1f5; }
      .suite-head h3 { margin: 0; font-size: 15px; }
      .suite-head .spacer { flex: 1; }
      .case-row { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid #f4f6f9; }
      .case-row:last-child { border-bottom: none; }
      .case-row:hover { background: #fafbfd; }
      .case-row .file { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: #3a4a5c; min-width: 220px; }
      .case-row .name { flex: 1; color: #1f2937; font-size: 14px; }
      .case-row.broken { background: #fff7f7; }
      .tag-error { background: #fdecea; color: #c0392b; border-radius: 999px; padding: 2px 8px; font-size: 12px; }
      .tag-seq { background: #eef4ff; color: #2f6fd0; border-radius: 999px; padding: 2px 8px; font-size: 12px; }
      .btn-mini { border: 1px solid #d8dee7; background: #fff; border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: #45526b; }
      .btn-mini:hover { background: #f2f5f9; }
      .btn-mini.danger { color: #c0392b; border-color: #f0c6c1; }
      .toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: #f7f9fc; }
      .toolbar .spacer { flex: 1; }
      .log-box { background: #fff; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
      .log-line { font-family: ui-monospace, Consolas, monospace; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; }
      .log-line .indent1 { padding-left: 18px; }
      .log-line .indent2 { padding-left: 36px; }
      .log-line .ok { color: #1a7f37; }
      .log-line .fail { color: #c0392b; }
      .log-line .run { color: #9aa4b2; }
      .log-line .ctx { color: #2f6fd0; font-weight: 600; }
      .run-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
      .run-head .spacer { flex: 1; }
      .result-box { background: #fff; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
      .result-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f4f6f9; font-size: 14px; }
      .result-row:last-child { border-bottom: none; }
      .modal-mask { position: fixed; inset: 0; background: rgba(20, 28, 40, 0.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
      .modal { background: #fff; border-radius: 14px; width: min(920px, 92vw); max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
      .modal.narrow { width: min(520px, 92vw); }
      .modal-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #eef1f5; }
      .modal-head h3 { margin: 0; font-size: 15px; font-family: ui-monospace, Consolas, monospace; }
      .modal-head .spacer { flex: 1; }
      .modal-body { padding: 16px 18px; overflow: auto; }
      .modal-foot { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid #eef1f5; background: #fbfcfe; }
      .modal-foot .spacer { flex: 1; }
      .editor-wrap { display: flex; border: 1px solid #dde3ec; border-radius: 10px; overflow: hidden; }
      .gutter { background: #f7f9fc; color: #9aa4b2; font-family: ui-monospace, Consolas, monospace; font-size: 13px; line-height: 20px; padding: 10px 8px; text-align: right; user-select: none; overflow: hidden; }
      .editor-wrap textarea { flex: 1; border: none; outline: none; resize: vertical; min-height: 420px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; line-height: 20px; padding: 10px 12px; tab-size: 2; }
      .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
      .field label { font-size: 13px; color: #5a6577; }
      .field input, .field select { padding: 8px 10px; border: 1px solid #dde3ec; border-radius: 8px; font-size: 14px; }
      .hint { font-size: 12px; color: #8b95a5; }
      .msg { font-size: 13px; }
      .msg.ok { color: #1a7f37; }
      .msg.err { color: #c0392b; }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div>
          <h1>game-smoke</h1>
          <p class="sub">用例管理 · 磁盘上的 YAML 是唯一真身，这里读写的就是那几个文件</p>
        </div>
        <div class="header-actions">
          <nav class="nav">
            <a href="/">运行看板</a>
            <a href="/cases" class="active">用例管理</a>
            <a href="/analytics">结果分析</a>
          </nav>
          <button id="refresh" type="button" class="btn ghost">刷新</button>
        </div>
      </header>

      <section id="suites"></section>

      <section class="log-box" id="run-panel" hidden>
        <div class="run-head">
          <strong id="run-title">正在运行</strong>
          <span class="spacer"></span>
          <span class="hint" id="run-elapsed"></span>
          <button id="stop" type="button" class="btn ghost">停止运行</button>
        </div>
        <div id="log-lines"></div>
      </section>

      <section class="result-box" id="result-panel" hidden>
        <div class="run-head"><strong id="result-title">上次运行结果</strong></div>
        <div id="result-rows"></div>
      </section>
    </div>

    <div class="modal-mask" id="modal-mask" hidden></div>
    <script src="/static/cases.js"></script>
  </body>
</html>
