# 冒烟 02：道具入口——背包/商店界面可正常打开
# 一条用例一个文件：beforeAll 用 game.ensure（已在主菜单则跳过，省掉重复进游戏）
beforeAll:
  - game.ensure:
      gameKey: douyin/edge-space

cases:
  - name: 道具-背包界面可正常打开
    steps:
      # 一次只给一个目标、给出位置与颜色：canvas 界面上左下角有礼盒/购物车/小房子三个相似图标，
      # 用"打开购物车和礼包"这类双目标描述会让模型反复开关、绕圈（实测 38 个子任务）
      - aiTap:
          prompt: 游戏主界面左下角、礼盒图标右侧的青色购物车图标
          $:
            continue-on-error: true
      # 只验证"商店能打开且渲染完成"，不依赖有没有商品：
      # 已购全部章节的账号里内容区本来就是空白面板，属于正常空态
      - aiWaitFor:
          prompt: 商店弹窗已完整显示：有"商店"标题、红色关闭按钮，以及底部的"补单""买入"按钮
          options:
            timeoutMs: 20000
          $:
            continue-on-error: true
      # 内容为空不算失败，但把现象写进报告，由人工判断是否符合预期
      - recordToReport:
          title: 商店商品列表状态（需人工确认）
          options:
            content: 若商店内容区是一大块空白灰蓝面板，可能是该测试账号已购全部章节，属于正常空态；若不是空态却也没有商品，则可能是商品列表渲染或数据拉取异常。
      # 用 aiAct 关窗：单次 aiTap 存在点偏就白点的问题（实测有一次 65s 仍未关闭）
      # 否定约束用于防止误点抖音小游戏容器的关闭按钮（会直接退出游戏）
      - aiAct: 关闭商店弹窗：点击"商店"弹窗标题栏右上角的红色 × 按钮；不要点屏幕最右上角抖音小游戏容器的关闭按钮；确保回到游戏主界面
      - aiWaitFor:
          prompt: 商店弹窗已关闭，能看到"新游戏""继续游戏"菜单
          options:
            timeoutMs: 20000